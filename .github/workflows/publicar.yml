# Arma CazaOfertas.exe en una compu con Windows y lo publica como "release".
# Se dispara al subir una etiqueta de versión, por ejemplo v1.0.1.
name: Publicar versión

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar herramientas
        run: python -m pip install --upgrade pip pyinstaller curl_cffi pillow

      - name: Poner el número de versión
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          [[ "$TAG" == v* ]] || TAG="v0.0.0-dev"
          echo "APP_VERSION = \"${TAG#v}\"" > version.py
          cat version.py

      - name: Ícono desde el logo
        run: python -c "from PIL import Image; Image.open('web/logo.png').convert('RGBA').save('app.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Armar el .exe
        run: >
          pyinstaller --noconfirm --clean --onefile --noconsole
          --name CazaOfertas --icon app.ico
          --add-data "web;web" --collect-all curl_cffi
          app.py

      - name: Probar que arranca
        shell: pwsh
        run: |
          $env:CAZAOFERTAS_PUERTO = "8799"
          $p = Start-Process -FilePath "dist\CazaOfertas.exe" -ArgumentList "--sin-ventana" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-RestMethod "http://127.0.0.1:8799/api/ping"; if ($r.app -eq "cazaofertas") { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "El .exe no respondió" }
          Write-Host "OK: versión $($r.app_version)"

      - name: Publicar
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CazaOfertas.exe
          generate_release_notes: false
          body_path: NOVEDADES.md
