# Publica una versión de CazaOfertas: prueba la app, arma el .zip con el código y el
# instalador (.bat) y los sube como "release". Sin .exe propio: así los antivirus no molestan.
name: Publicar versión

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar herramientas
        run: python -m pip install -r requirements.txt pillow

      - name: Poner el número de versión
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          [[ "$TAG" == v* ]] || TAG="v0.0.0"
          echo "APP_VERSION = \"${TAG#v}\"" > version.py
          cat version.py

      - name: Ícono desde el logo
        run: python -c "from PIL import Image; Image.open('web/logo.png').convert('RGBA').save('app.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Probar que arranca
        shell: pwsh
        run: |
          $env:CAZAOFERTAS_PUERTO = "8799"
          $p = Start-Process -FilePath python -ArgumentList "app.py","--sin-ventana" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-RestMethod "http://127.0.0.1:8799/api/ping"; if ($r.app -eq "cazaofertas") { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "La app no respondió" }
          Write-Host "OK: versión $($r.app_version)"

      - name: Armar el .zip de la app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist, paquete | Out-Null
          Copy-Item *.py, requirements.txt, app.ico -Destination paquete
          Copy-Item web -Destination paquete -Recurse
          Remove-Item paquete\publicar.ps1 -ErrorAction SilentlyContinue
          Compress-Archive -Path paquete\* -DestinationPath dist\CazaOfertas-app.zip -Force
          Copy-Item Instalar-CazaOfertas.bat dist\
          Get-ChildItem dist

      - name: Probar el instalador
        shell: pwsh
        run: |
          $zip = (Resolve-Path dist\CazaOfertas-app.zip).Path
          $p = Start-Process -FilePath cmd -ArgumentList "/c","dist\Instalar-CazaOfertas.bat","`"$zip`"" -PassThru -NoNewWindow
          if (-not $p.WaitForExit(600000)) { throw "El instalador tardó demasiado" }
          $app = Join-Path $env:LOCALAPPDATA "Programs\CazaOfertas\app.py"
          if (-not (Test-Path $app)) { throw "El instalador no dejó la app instalada" }
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-RestMethod "http://127.0.0.1:8767/api/ping"; if ($r.app -eq "cazaofertas") { $ok = $true; break } } catch {}
          }
          Get-Process python, pythonw -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { throw "La app instalada no arrancó" }
          Write-Host "Instalada y funcionando: $($r.app_version)"

      - name: Publicar
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CazaOfertas-app.zip
            dist/Instalar-CazaOfertas.bat
          generate_release_notes: false
          body_path: NOVEDADES.md
